                &lt;button onclick=&quot;document.getElementById('modal-export').classList.add('hidden')&quot; class=&quot;text-slate-400 hover:text-slate-600&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;24&quot; height=&quot;24&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; data-lucide=&quot;x&quot; aria-hidden=&quot;true&quot; class=&quot;lucide lucide-x&quot;&gt;&lt;path d=&quot;M18 6 6 18&quot;&gt;&lt;/path&gt;&lt;path d=&quot;m6 6 12 12&quot;&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/button&gt;
            &lt;/div&gt;
            
            &lt;!-- Selector de tipo de código --&gt;
            &lt;div class=&quot;flex border-b border-slate-100&quot;&gt;
                &lt;button id=&quot;tab-html&quot; class=&quot;px-4 py-2 text-xs font-bold uppercase tracking-wider tab-active transition-all&quot;&gt;Código HTML Completo&lt;/button&gt;
                &lt;button id=&quot;tab-iframe&quot; class=&quot;px-4 py-2 text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-slate-600 transition-all&quot;&gt;Código iFrame (Incrustar)&lt;/button&gt;
            &lt;/div&gt;

            &lt;div id=&quot;container-html&quot; class=&quot;space-y-3&quot;&gt;
                &lt;p class=&quot;text-[10px] text-slate-500&quot;&gt;Ideal para guardar como archivo .html o para eXeLearning (Pestaña Fuente/HTML).&lt;/p&gt;
                &lt;textarea id=&quot;export-code&quot; class=&quot;w-full h-56 p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-[9px] focus:outline-none overflow-y-auto&quot; readonly=&quot;&quot;&gt;&lt;/textarea&gt;
                &lt;button id=&quot;copy-btn&quot; class=&quot;w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition-colors&quot;&gt;Copiar Código HTML&lt;/button&gt;
            &lt;/div&gt;

            &lt;div id=&quot;container-iframe&quot; class=&quot;space-y-3 hidden&quot;&gt;
                &lt;p class=&quot;text-[10px] text-slate-500&quot;&gt;Copia este código para incrustar la actividad en Moodle, blogs o cualquier sitio web mediante un iFrame autogestionado.&lt;/p&gt;
                &lt;textarea id=&quot;export-iframe&quot; class=&quot;w-full h-56 p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-[9px] focus:outline-none overflow-y-auto&quot; readonly=&quot;&quot;&gt;&lt;/textarea&gt;
                &lt;button id=&quot;copy-iframe-btn&quot; class=&quot;w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition-colors&quot;&gt;Copiar Código iFrame&lt;/button&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;script&gt;
        const state = {
            mode: 'author',
            image: null,
            conceptBank: [],
            selectedIdx: null,
            labels: [],
            score: 0
        };

        const els = {
            imageInput: document.getElementById('image-input'),
            welcomeScreen: document.getElementById('welcome-screen'),
            sidebar: document.getElementById('sidebar'),
            viewport: document.getElementById('viewport'),
            displayImg: document.getElementById('display-img'),
            dropLayer: document.getElementById('drop-layer'),
            conceptInput: document.getElementById('concept-input'),
            addConceptBtn: document.getElementById('add-concept-btn'),
            conceptBankList: document.getElementById('concept-bank-list'),
            placedLabelsList: document.getElementById('placed-labels-list'),
            exportBtn: document.getElementById('export-btn'),
            newActivityBtn: document.getElementById('new-activity-btn'),
            restartBtn: document.getElementById('restart-btn'),
            setupPanel: document.getElementById('setup-panel'),
            playPanel: document.getElementById('play-panel'),
            draggableItems: document.getElementById('draggable-items'),
            gameHud: document.getElementById('game-hud'),
            scoreVal: document.getElementById('score-val'),
            totalVal: document.getElementById('total-val'),
            progressFill: document.getElementById('progress-fill'),
            progressVal: document.getElementById('progress-val'),
            modalSuccess: document.getElementById('modal-success'),
            modalExport: document.getElementById('modal-export'),
            exportCode: document.getElementById('export-code'),
            exportIframe: document.getElementById('export-iframe'),
            copyBtn: document.getElementById('copy-btn'),
            copyIframeBtn: document.getElementById('copy-iframe-btn'),
            finalRestartBtn: document.getElementById('final-restart-btn'),
            saveProjectBtn: document.getElementById('save-project-btn'),
            loadProjectBtn: document.getElementById('load-project-btn'),
            loadProjectInput: document.getElementById('load-project-input'),
            welcomeLoadBtn: document.getElementById('welcome-load-btn'),
            tabHtml: document.getElementById('tab-html'),
            tabIframe: document.getElementById('tab-iframe'),
            containerHtml: document.getElementById('container-html'),
            containerIframe: document.getElementById('container-iframe')
        };

        // --- GESTIÓN DE PESTAÑAS ---
        els.tabHtml.onclick = () =&gt; {
            els.tabHtml.classList.add('tab-active'); els.tabHtml.classList.remove('text-slate-400');
            els.tabIframe.classList.remove('tab-active'); els.tabIframe.classList.add('text-slate-400');
            els.containerHtml.classList.remove('hidden'); els.containerIframe.classList.add('hidden');
        };
        els.tabIframe.onclick = () =&gt; {
            els.tabIframe.classList.add('tab-active'); els.tabIframe.classList.remove('text-slate-400');
            els.tabHtml.classList.remove('tab-active'); els.tabHtml.classList.add('text-slate-400');
            els.containerIframe.classList.remove('hidden'); els.containerHtml.classList.add('hidden');
        };

        // --- INICIO ---
        window.onload = () =&gt; {
            const rawData = document.getElementById('activity-data').textContent;
            try {
                const config = JSON.parse(rawData);
                if (config.image &amp;&amp; config.labels) {
                    state.image = config.image;
                    state.labels = config.labels;
                    state.conceptBank = [...new Set(config.labels.map(l =&gt; l.text))];
                    state.mode = 'student';
                    els.displayImg.src = state.image;
                    els.welcomeScreen.classList.add('hidden');
                    els.sidebar.classList.remove('hidden');
                    els.viewport.classList.remove('hidden');
                    render();
                }
            } catch (e) {
                lucide.createIcons();
            }
        };

        // --- CARGAR IMAGEN ---
        els.imageInput.addEventListener('change', (e) =&gt; {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) =&gt; {
                state.image = ev.target.result;
                els.displayImg.src = state.image;
                els.welcomeScreen.classList.add('hidden');
                els.sidebar.classList.remove('hidden');
                els.viewport.classList.remove('hidden');
                render();
            };
            reader.readAsDataURL(file);
        });

        // --- RESET EDITOR ---
        els.newActivityBtn.addEventListener('click', () =&gt; {
            if (confirm(&quot;¿Borrar configuración actual y subir nueva imagen?&quot;)) {
                state.image = null; state.conceptBank = []; state.labels = []; state.selectedIdx = null;
                els.imageInput.value = &quot;&quot;;
                els.welcomeScreen.classList.remove('hidden');
                els.sidebar.classList.add('hidden');
                els.viewport.classList.add('hidden');
                render();
            }
        });

        // --- CONCEPTOS ---
        els.addConceptBtn.addEventListener('click', () =&gt; {
            const val = els.conceptInput.value.trim();
            if(val) { state.conceptBank.push(val); els.conceptInput.value = ''; render(); }
        });

        // --- UBICACIÓN ---
        els.dropLayer.addEventListener('click', (e) =&gt; {
            if (state.mode !== 'author' || state.selectedIdx === null) return;
            const rect = els.dropLayer.getBoundingClientRect();
            state.labels.push({
                id: Date.now(),
                text: state.conceptBank[state.selectedIdx],
                x: ((e.clientX - rect.left) / rect.width) * 100,
                y: ((e.clientY - rect.top) / rect.height) * 100,
                placed: false
            });
            render();
        });

        // --- JUEGO ---
        function onDrop(e, target) {
            e.preventDefault();
            const text = e.dataTransfer.getData('text/plain');
            if (text.toLowerCase() === target.text.toLowerCase()) {
                target.placed = true;
                state.score++;
                render();
                if (state.score === state.labels.length) {
                    setTimeout(() =&gt; els.modalSuccess.classList.remove('hidden'), 300);
                }
            } else {
                const el = e.currentTarget;
                el.classList.add('bg-red-500', 'error-shake');
                setTimeout(() =&gt; el.classList.remove('bg-red-500', 'error-shake'), 600);
            }
        }

        // --- EXPORTACIÓN ---
        els.exportBtn.addEventListener('click', () =&gt; {
            const data = JSON.stringify({ image: state.image, labels: state.labels });
            // Generar HTML Completo
            const fullHtml = document.documentElement.outerHTML.replace(
                /&lt;script id=&quot;activity-data&quot; type=&quot;application\/json&quot;&gt;[\s\S]*?&lt;\/script&gt;/,
                &#96;&lt;script id=&quot;activity-data&quot; type=&quot;application/json&quot;&gt;${data}&lt;\/script&gt;&#96;
            );
            els.exportCode.value = fullHtml;

            // Generar iFrame (escapando comillas para el srcdoc)
            const escapedHtml = fullHtml
                .replace(/&amp;/g, '&amp;amp;')
                .replace(/&quot;/g, '&amp;quot;')
                .replace(/'/g, '&amp;#39;');
            
            els.exportIframe.value = &#96;&lt;iframe srcdoc=&quot;${escapedHtml}&quot; width=&quot;100%&quot; height=&quot;600px&quot; style=&quot;border:none; border-radius:15px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);&quot; allow=&quot;fullscreen&quot;&gt;&lt;/iframe&gt;&#96;;
            
            els.modalExport.classList.remove('hidden');
        });

        els.copyBtn.addEventListener('click', () =&gt; {
            els.exportCode.select();
            document.execCommand('copy');
            els.copyBtn.innerText = &quot;¡Código Copiado!&quot;;
            setTimeout(() =&gt; els.copyBtn.innerText = &quot;Copiar Código HTML&quot;, 2000);
        });

        els.copyIframeBtn.addEventListener('click', () =&gt; {
            els.exportIframe.select();
            document.execCommand('copy');
            els.copyIframeBtn.innerText = &quot;¡iFrame Copiado!&quot;;
            setTimeout(() =&gt; els.copyIframeBtn.innerText = &quot;Copiar Código iFrame&quot;, 2000);
        });

        // --- GESTIÓN DE PROYECTOS ---
        els.saveProjectBtn.addEventListener('click', () =&gt; {
            const dataStr = JSON.stringify({ image: state.image, conceptBank: state.conceptBank, labels: state.labels }, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = &#96;proyecto-etiquetado-${Date.now()}.json&#96;;
            link.click();
            URL.revokeObjectURL(url);
        });

        const handleLoadProject = (e) =&gt; {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) =&gt; {
                try {
                    const config = JSON.parse(ev.target.result);
                    if (config.image) {
                        state.image = config.image;
                        state.conceptBank = config.conceptBank || [];
                        state.labels = config.labels || [];
                        state.selectedIdx = null;
                        state.mode = 'author';
                        els.displayImg.src = state.image;
                        els.welcomeScreen.classList.add('hidden');
                        els.sidebar.classList.remove('hidden');
                        els.viewport.classList.remove('hidden');
                        render();
                    }
                } catch (err) { alert(&quot;Error al cargar el proyecto.&quot;); }
            };
            reader.readAsText(file);
        };

        els.loadProjectBtn.addEventListener('click', () =&gt; els.loadProjectInput.click());
        els.welcomeLoadBtn.addEventListener('click', () =&gt; els.loadProjectInput.click());
        els.loadProjectInput.addEventListener('change', handleLoadProject);

        // --- RENDERIZADO ---
        function render() {
            if (state.mode === 'author') {
                els.setupPanel.classList.remove('hidden');
                document.getElementById('setup-actions').classList.remove('hidden');
                els.restartBtn.classList.add('hidden');
                
                els.conceptBankList.innerHTML = '';
                state.conceptBank.forEach((c, i) =&gt; {
                    const btn = document.createElement('button');
                    btn.className = &#96;px-3 py-1.5 rounded-xl text-[11px] font-bold border-2 transition-all ${state.selectedIdx === i ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg' : 'bg-slate-50 border-slate-100 text-slate-600 hover:border-slate-200'}&#96;;
                    btn.innerText = c;
                    btn.onclick = () =&gt; { state.selectedIdx = i; render(); };
                    els.conceptBankList.appendChild(btn);
                });

                els.placedLabelsList.innerHTML = '';
                state.labels.slice().reverse().forEach(l =&gt; {
                    const div = document.createElement('div');
                    div.className = 'flex items-center justify-between p-2.5 bg-white border border-slate-100 rounded-xl text-[11px] shadow-sm';
                    div.innerHTML = &#96;&lt;span class=&quot;font-bold text-slate-700 truncate mr-2&quot;&gt;${l.text}&lt;/span&gt; &lt;button onclick=&quot;removePoint(${l.id})&quot; class=&quot;text-red-400 hover:text-red-600 transition-colors font-black shrink-0&quot;&gt;× Eliminar&lt;/button&gt;&#96;;
                    els.placedLabelsList.appendChild(div);
                });
            } else {
                els.setupPanel.classList.add('hidden');
                document.getElementById('setup-actions').classList.add('hidden');
                els.playPanel.classList.remove('hidden');
                els.gameHud.classList.remove('hidden');
                els.restartBtn.classList.remove('hidden');
                document.getElementById('header-title').innerText = &quot;Actividad Educativa&quot;;

                els.draggableItems.innerHTML = '';
                state.labels.filter(l =&gt; !l.placed).sort(() =&gt; Math.random() - 0.5).forEach(l =&gt; {
                    const drag = document.createElement('div');
                    drag.className = 'px-4 py-2.5 bg-white border-2 border-indigo-100 text-indigo-700 rounded-xl cursor-grab font-black text-[11px] uppercase shadow-sm active:scale-95 transition-transform';
                    drag.innerText = l.text;
                    drag.draggable = true;
                    drag.ondragstart = (e) =&gt; { e.dataTransfer.setData('text/plain', l.text); };
                    els.draggableItems.appendChild(drag);
                });

                els.totalVal.innerText = state.labels.length;
                els.scoreVal.innerText = state.score;
                const p = Math.round((state.score / state.labels.length) * 100) || 0;
                els.progressFill.style.width = &#96;${p}%&#96;;
                els.progressVal.innerText = &#96;${p}%&#96;;
            }

            els.dropLayer.innerHTML = '';
            state.labels.forEach(l =&gt; {
                const point = document.createElement('div');
                point.style.left = &#96;${l.x}%&#96;; point.style.top = &#96;${l.y}%&#96;;
                point.className = 'absolute -translate-x-1/2 -translate-y-1/2';
                
                if (state.mode === 'author') {
                    point.innerHTML = &#96;&lt;div class=&quot;w-3.5 h-3.5 bg-slate-800 border-2 border-white rounded-full shadow-lg&quot;&gt;&lt;/div&gt;&#96;;
                } else {
                    if (l.placed) {
                        point.innerHTML = &#96;&lt;div class=&quot;flex flex-col items-center success-pop&quot;&gt;&lt;div class=&quot;w-7 h-7 bg-green-500 border-2 border-white rounded-full flex items-center justify-center text-white shadow-lg&quot;&gt;&lt;i data-lucide=&quot;check&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;mt-1 px-2 py-0.5 bg-green-600 text-white text-[8px] rounded font-black uppercase tracking-tighter shadow-md whitespace-nowrap&quot;&gt;${l.text}&lt;/div&gt;&lt;/div&gt;&#96;;
                    } else {
                        const zone = document.createElement('div');
                        zone.className = 'w-10 h-10 bg-white/30 border-2 border-dashed border-indigo-400 rounded-full pulse-animation transition-all cursor-default';
                        zone.ondragover = (e) =&gt; { e.preventDefault(); zone.classList.add('drop-zone-active'); };
                        zone.ondragleave = () =&gt; zone.classList.remove('drop-zone-active');
                        zone.ondrop = (e) =&gt; onDrop(e, l);
                        point.appendChild(zone);
                    }
                }
                els.dropLayer.appendChild(point);
            });
            lucide.createIcons();
        }

        window.removePoint = (id) =&gt; { state.labels = state.labels.filter(p =&gt; p.id !== id); render(); };
        els.restartBtn.onclick = () =&gt; { state.score = 0; state.labels.forEach(l =&gt; l.placed = false); render(); };
        els.finalRestartBtn.onclick = () =&gt; { els.modalSuccess.classList.add('hidden'); state.score = 0; state.labels.forEach(l =&gt; l.placed = false); render(); };

    &lt;/script&gt;

&lt;div id=&quot;volume-booster-visusalizer&quot;&gt;
                    &lt;div class=&quot;sound&quot;&gt;
                        &lt;div class=&quot;sound-icon&quot;&gt;&lt;/div&gt;
                        &lt;div class=&quot;sound-wave sound-wave_one&quot;&gt;&lt;/div&gt;
                        &lt;div class=&quot;sound-wave sound-wave_two&quot;&gt;&lt;/div&gt;
                        &lt;div class=&quot;sound-wave sound-wave_three&quot;&gt;&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;segments-box&quot;&gt;
                        &lt;div data-range=&quot;1-20&quot; class=&quot;segment&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
                        &lt;div data-range=&quot;21-40&quot; class=&quot;segment&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
                        &lt;div data-range=&quot;41-60&quot; class=&quot;segment&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
                        &lt;div data-range=&quot;61-80&quot; class=&quot;segment&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
                        &lt;div data-range=&quot;81-100&quot; class=&quot;segment&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
                    &lt;/div&gt;
                &lt;/div&gt;&lt;div class=&quot;paintRoot&quot; id=&quot;paintRootID&quot;&gt;&lt;/div&gt;&lt;div id=&quot;screenity-ui&quot;&gt;&lt;div class=&quot;screenity-shadow-dom&quot;&gt;&lt;div&gt;&lt;div class=&quot;screenity-scrollbar&quot;&gt;&lt;/div&gt;&lt;div class=&quot;screenity-scrollbar&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;style type=&quot;text/css&quot;&gt;
			#screenity-ui, #screenity-ui div {
				background-color: unset;
				padding: unset;
				width: unset;
				box-shadow: unset;
				display: unset;
				margin: unset;
				border-radius: unset;

				pointer-events: none;
				border-radius: 5px!important;
			}
		.screenity-blur {
			filter: blur(10px)!important;
		}
			.screenity-shadow-dom * {
				transition: unset;
			}

	z-index: 99999999!important;

}

.screenity-shadow-dom .hide-tooltip {
	display: none!important;
}

	margin-bottom: 20px;
}

	margin-bottom: 5px;
}

.screenity-shadow-dom .TooltipContent[data-state='delayed-open'][data-side='top'] {
	animation-name: screenity-slideDownAndFade;
}
.screenity-shadow-dom .TooltipContent[data-state='delayed-open'][data-side='right'] {
  animation-name: screenity-slideLeftAndFade;
}
.screenity-shadow-dom.TooltipContent[data-state='delayed-open'][data-side='bottom'] {
  animation-name: screenity-slideUpAndFade;
}
.screenity-shadow-dom.TooltipContent[data-state='delayed-open'][data-side='left'] {
  animation-name: screenity-slideRightAndFade;
}

@keyframes screenity-slideUpAndFade {
  from { opacity: 0; transform: translateY(2px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes screenity-slideRightAndFade {
  from { opacity: 0; transform: translateX(-2px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes screenity-slideDownAndFade {
  from { opacity: 0; transform: translateY(-2px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes screenity-slideLeftAndFade {
  from { opacity: 0; transform: translateX(2px); }
  to   { opacity: 1; transform: translateX(0); }
}

	position: fixed;
	top: 0px!important;

    0px 10px 20px -15px rgba(22, 23, 24, 0.2);

  animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
  will-change: transform, opacity;
}

}

  justify-content: center;

.ScreenityDropdownMenuItem,
.ScreenityDropdownMenuRadioItem {
  font-size: 14px;
